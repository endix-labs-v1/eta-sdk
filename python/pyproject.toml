[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "eta-api"
dynamic = ["version"]
description = "The eta API for Python: read, post, run your narratives and trade by code."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "eta" }]
keywords = ["eta", "trading", "api", "sdk", "narratives"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
    "Typing :: Typed",
    "Framework :: AsyncIO",
]
dependencies = [
    "requests>=2.25",
    "websockets>=14.1",  # 14.1: frames that came before a close are still read (13.x and 14.0 drop them)
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Documentation = "https://eta-cash.gitbook.io/api/"
Source = "https://github.com/endix-labs-v1/eta-sdk"

[tool.setuptools]
packages = ["eta_api"]

[tool.setuptools.dynamic]
version = { attr = "eta_api._version.__version__" }

[tool.setuptools.package-data]
eta_api = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
